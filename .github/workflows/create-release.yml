name: Create release (one-off)

on:
  push:
    branches: [main]

jobs:
  create-release:
    if: startsWith(github.event.head_commit.message, 'Create release v3.2.0-lefty.2')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.2.0-lefty.2 \
            --title "Lefty 3.2.0-lefty.2" \
            --target main \
            --notes "$(cat release-notes.md)" \
            release-assets/lefty-3.2.0-lefty.2.apk
